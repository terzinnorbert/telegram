name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          check-latest: true

      - name: Run Tests
        run: go test -v ./...

      - name: Build Cross-Platform Binaries
        run: |
          mkdir -p dist
          # Linux AMD64
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/tg-linux-amd64 .
          # Linux ARM64
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o dist/tg-linux-arm64 .
          # macOS Apple Silicon (ARM64)
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o dist/tg-darwin-arm64 .
          # macOS Intel (AMD64)
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o dist/tg-darwin-amd64 .
          # Windows AMD64
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o dist/tg-windows-amd64.exe .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/tg-linux-amd64
            dist/tg-linux-arm64
            dist/tg-darwin-arm64
            dist/tg-darwin-amd64
            dist/tg-windows-amd64.exe
